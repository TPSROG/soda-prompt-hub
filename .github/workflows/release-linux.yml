name: Release Linux

# 主任务书 §17：只有「上游版本变化」且「Linux CI 通过」才产出 Linux 发行包。
# 第一阶段只出 tar.gz + SHA256SUMS，不做 deb / rpm / AppImage / Snap / Flatpak。
#
# 触发方式：Linux 工作流在维护分支上成功后自动检查版本；也可手动触发。

on:
  workflow_run:
    workflows: ["Linux"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Linux 包
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 读取版本并判断是否需要发布
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -n1)"
          if [[ -z "${version}" ]]; then
            echo "::error::无法从 pyproject.toml 读取版本"
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          if gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -qE "^v${version//./\\.}-linux-"; then
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            echo "版本 ${version} 已有 Linux 发行包，跳过"
          else
            echo "publish=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: 组装发行包
        id: package
        if: steps.version.outputs.publish == 'true'
        run: |
          set -Eeuo pipefail
          version="${{ steps.version.outputs.version }}"
          stamp="$(date -u +%Y%m%d)"
          name="soda-prompt-hub-linux-x86_64-${version}-${stamp}"
          root="build/${name}/soda-prompt-hub"
          mkdir -p "${root}"

          # 程序本体（deploy/linux/install.sh 以仓库根为基准，因此保持同一层级）
          cp -r src "${root}/src"
          cp pyproject.toml uv.lock .python-version "${root}/"
          # 部署与工具
          cp -r deploy "${root}/deploy"
          cp -r scripts "${root}/scripts"
          # 文档与说明
          cp -r docs "${root}/docs"
          cp README.md CHANGELOG.md LICENSE .gitattributes "${root}/"
          # 去掉不需要进入发行包的内容
          find "${root}" -name "__pycache__" -type d -prune -exec rm -rf {} +
          find "${root}" -name "*.pyc" -delete

          tar -C "build/${name}" -czf "build/${name}.tar.gz" soda-prompt-hub
          (cd build && sha256sum "${name}.tar.gz" >SHA256SUMS)
          echo "发行包内容（前 20 项）:"
          tar -tzf "build/${name}.tar.gz" | head -n 20
          cat build/SHA256SUMS
          echo "asset=build/${name}.tar.gz" >>"${GITHUB_OUTPUT}"

      - name: 创建 Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          version="${{ steps.version.outputs.version }}"
          stamp="$(date -u +%Y%m%d)"
          tag="v${version}-linux-${stamp}"
          upstream_sha="$(git rev-parse --short HEAD)"
          {
            echo "Soda Prompt Hub Linux 构建（**非官方**，上游版本 ${version}）"
            echo
            echo "- 上游基线提交: \`${upstream_sha}\`"
            echo "- Linux 支持状态: **Experimental**（核心可用；Compute Worker / SMB 双机 / LoRA 训练不在此包内）"
            echo "- 安装: 解压后运行 \`./deploy/linux/install.sh\`，详见 \`docs/linux/INSTALL.md\`"
            echo "- 更新: \`./deploy/linux/update.sh\`（不会改动用户数据）"
            echo
            echo "校验: 与本 Release 的 \`SHA256SUMS\` 比对后再使用。"
          } >release-notes.md
          gh release create "${tag}" \
            "${{ steps.package.outputs.asset }}" \
            build/SHA256SUMS \
            --title "Soda Prompt Hub Linux ${version} (${stamp})" \
            --notes-file release-notes.md \
            --prerelease
